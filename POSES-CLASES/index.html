<html><head>
  <meta charset="UTF-8">
  <title>Evaluación de Replicación PROJECT</title>
  
  <link rel="stylesheet" href="./style.css">

  <script src="p5.min.js"></script>
  <script src="p5.dom.min.js"></script>
  <script src="ml5.min.js" type="text/javascript"></script>

  <style></style>
</head>

<body>
  <h2>Evaluación sistema motríz grueso</h2>
  <div id="videoContainer"></div>
  <p id="status">Loading Model...</p>
  <br><p>
    <button dark id="addClassA">Add an Example to Class A</button>
    <button dark id="resetA">Reset Class A</button>
    </p><p><span id="exampleA">0</span> A examples</p>
    <p>| Confidence in A is: <span id="confidenceA">0</span></p>

    <br><button dark id="addClassB">Add an Example to Class B</button>
    <button dark id="resetB">Reset Class B</button>
    <p><span id="exampleB">0</span> B examples</p>
    <p>| Confidence in B is: <span id="confidenceB">0</span></p>
  
  <br>
  <p>
    <button dark id="buttonPredict">Start predicting!</button><br>
    <button dark id="clearAll">Clear all classes</button><br>
  </p>
  <p>
    KNN Classifier with mobileNet model labeled this
    as Class: <span id="result">...</span>
    with a confidence of <span id="confidence">...</span>
  </p>
  <script src="sketch.js"></script>


</body></html>
